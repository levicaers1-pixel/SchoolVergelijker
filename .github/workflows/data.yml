name: Data bouwen

# Bouwt data/*.json opnieuw op Linux (poppler-utils) zodra er een verslag, bron of script bijkomt,
# en zet het resultaat terug op dezelfde branch.
on:
  push:
    paths: ['verslagen/**', 'pipeline/**', 'bron/**', '.github/workflows/data.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -r pipeline/requirements.txt
      - run: cd pipeline && bash bouw.sh
      - name: Wijzigingen tonen en vastleggen
        run: |
          git diff --stat -- data/
          if git diff --quiet -- data/; then echo "Geen wijzigingen in data/"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data opnieuw gebouwd"
          git push
