name: Website publiceren

on:
  push:
    branches: [main]
    paths: ['app/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Een commit van 'Data bouwen' start zelf geen workflows, dus wachten we daarop.
  workflow_run:
    workflows: ['Data bouwen']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 app/maak_preview.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
